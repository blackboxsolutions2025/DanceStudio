<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm & Soul | Forgot Password</title>
    <!-- Shared Header Styles -->
    <link rel="stylesheet" href="../Shared/header.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Page Specific Styles -->
    <link rel="stylesheet" href="ForgotPasswordPage.css">
</head>
<body>

    <!-- Shared Header Placeholder -->
    <div id="header-placeholder"></div>

    <main class="auth-main">
        <div class="auth-container">
            <div class="auth-card">
                <form id="forgotForm" class="auth-form">
                    <h2>Forgot Password?</h2>
                    <p class="subtitle">Enter your registered email address and we'll send you a secure link to reset your password.</p>

                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Email Address</label>
                        <input type="email" id="forgotEmail" required placeholder="student@rhythmsoul.com">
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>

                    <p class="toggle-prompt">Remember your password? <a href="../LoginPage/LoginPage.html">Log in here</a></p>
                </form>
            </div>
        </div>
    </main>

    <!-- Global Modal Scripts -->
    <script src="../Shared/success-modal.js"></script>
    <script src="../Shared/error-modal.js"></script>
    <!-- Shared Header Script -->
    <script src="../Shared/header.js"></script>
    <!-- Page Specific Script -->
    <script src="ForgotPasswordPage.js"></script>
</body>
</html>
