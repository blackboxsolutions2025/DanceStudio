<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Add Venue - Rhythm & Soul</title>
    <link rel="stylesheet" href="../Shared/header.css">
    <link rel="stylesheet" href="VenueBuilderPage.css">
</head>
<body>
    <!-- Global Header Placeholder -->
    <div id="header-placeholder"></div>

    <main class="admin-main-container">
        <div class="page-header-row">
            <div class="title-area">
                <h1 id="mainHeading">Add New Venue</h1>
                <p id="subHeading">Create a new studio room or facility for classes and private rentals.</p>
            </div>
            <div class="header-action-buttons">
                <a href="../VenueListPage/VenueListPage.html" class="btn-secondary">
                    <i class="fa-solid fa-arrow-left"></i> Back to Venues
                </a>
            </div>
        </div>

        <div class="form-card-container">
            <form id="venueForm" enctype="multipart/form-data">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="venueName"><i class="fa-solid fa-building"></i> Venue Name <span class="required">*</span></label>
                        <input type="text" id="venueName" name="name" required placeholder="e.g. Studio A, Main Ballroom" class="form-input">
                    </div>

                    <div class="form-group full-width">
                        <label for="venueLocation"><i class="fa-solid fa-location-dot"></i> Location / Address</label>
                        <input type="text" id="venueLocation" name="location" placeholder="e.g. 2nd Floor, Main Building, Davao City" class="form-input">
                    </div>

                    <div class="form-group full-width">
                        <label for="venueLocationLink"><i class="fa-solid fa-map-location-dot"></i> Google Maps / Location Link</label>
                        <input type="url" id="venueLocationLink" name="location_link" placeholder="https://maps.google.com/..." class="form-input">
                    </div>

                    <div class="form-group full-width">
                        <label for="venueHourlyRate"><i class="fa-solid fa-peso-sign"></i> Hourly Rate (PHP) <span class="required">*</span></label>
                        <input type="number" step="0.01" id="venueHourlyRate" name="hourly_rate" value="1500.00" required placeholder="e.g. 1500.00" class="form-input">
                    </div>

                    <div class="form-group full-width">
                        <label for="venueImageFile"><i class="fa-solid fa-image"></i> Main Venue Image</label>
                        <div style="display: flex; align-items: center; gap: 12px; width: 100%;">
                            <label style="background: rgba(16, 185, 129, 0.15); color: #34d399; padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; border: 1px solid rgba(16, 185, 129, 0.3); display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; transition: all 0.2s;">
                                <i class="fa-solid fa-folder-open"></i> Choose File
                                <input type="file" id="venueImageFile" name="venueImage" accept="image/*" style="display: none;" onchange="handleMainImageChange(event)">
                            </label>
                            <span id="mainImageFileName" style="color: #94a3b8; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="No file chosen">No file chosen</span>
                        </div>
                        <small style="color: #94a3b8; margin-top: 4px; display: block;">Upload the primary cover photo representing this venue.</small>
                        <div id="currentImagePreview" class="image-preview-wrapper" style="display: none; margin-top: 10px;">
                            <img id="previewImg" src="" alt="Main Venue Preview" style="max-height: 150px; border-radius: 8px; border: 1px solid rgba(16,185,129,0.3);">
                        </div>
                    </div>

                    <!-- Gallery Images Section -->
                    <div class="form-group full-width" style="margin-top: 15px;">
                        <label><i class="fa-solid fa-images"></i> Venue Gallery Images & Sequencing</label>
                        <small style="color: #94a3b8; margin-bottom: 8px; display: block;">Add multiple photos showcasing the venue. Use the up and down arrow buttons to set their display sequence.</small>
                        
                        <div id="galleryRowsContainer" class="gallery-container">
                            <!-- Dynamic gallery rows injected here -->
                        </div>

                        <button type="button" class="btn-add-gallery" onclick="addGalleryRow()">
                            <i class="fa-solid fa-plus"></i> Add Gallery Image Row
                        </button>
                    </div>
                </div>

                <div class="form-actions-row">
                    <button type="button" class="btn-secondary" id="cancelBtn" onclick="window.location.href='../VenueListPage/VenueListPage.html'">Cancel</button>
                    <button type="submit" id="submitBtn" class="btn-primary">
                        <i class="fa-solid fa-floppy-disk"></i> Save Venue
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="../Shared/header.js"></script>
    <script src="VenueBuilderPage.js"></script>
</body>
</html>
