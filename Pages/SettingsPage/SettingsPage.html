<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings - Rhythm & Soul</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Universal Header Styles -->
    <link rel="stylesheet" href="../Shared/header.css">
    <!-- Page Custom Styles -->
    <link rel="stylesheet" href="/SettingsPage/SettingsPage.css">
</head>
<body>
    <!-- Header Placeholder for Universal header.js -->
    <div id="header-placeholder"></div>

    <main class="settings-container">
        <div class="settings-header">
            <h1><i class="fa-solid fa-gear"></i> Account Settings</h1>
            <p>Manage your personal profile data and security credentials.</p>
        </div>

        <!-- 1. Profile Editor Section -->
        <section class="settings-section">
            <div class="section-title">
                <i class="fa-solid fa-user-pen"></i>
                <h2>Profile Information</h2>
            </div>
            <form id="profileForm" class="settings-form">
                <div class="profile-pic-container">
                    <div class="profile-avatar-preview" id="avatarPreviewContainer">
                        <i class="fa-solid fa-user" id="avatarPlaceholderIcon"></i>
                        <img id="avatarImg" src="" alt="Profile Picture" style="display: none;">
                    </div>
                    <div class="profile-pic-actions">
                        <label for="profilePicInput" class="btn-secondary">
                            <i class="fa-solid fa-camera"></i> Change Picture
                        </label>
                        <input type="file" id="profilePicInput" accept="image/*" style="display: none;">
                        <span class="file-hint">JPG, PNG or GIF (Max 2MB)</span>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="profileName">Full Name</label>
                        <input type="text" id="profileName" required placeholder="Enter your full name">
                    </div>
                    <div class="form-group">
                        <label for="profilePhone">Phone Number</label>
                        <input type="tel" id="profilePhone" required placeholder="Enter your phone number">
                    </div>
                    <div class="form-group">
                        <label for="profileEmail">Email Address (Read-only)</label>
                        <input type="email" id="profileEmail" disabled class="disabled-input">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">
                        <i class="fa-solid fa-floppy-disk"></i> Save Profile Changes
                    </button>
                </div>
            </form>
        </section>

        <!-- 2. Security Section -->
        <section class="settings-section">
            <div class="section-title">
                <i class="fa-solid fa-shield-halved"></i>
                <h2>Security & Password</h2>
            </div>
            <form id="securityForm" class="settings-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="currentPassword">Current Password</label>
                        <input type="password" id="currentPassword" required placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" required placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" required placeholder="••••••••">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">
                        <i class="fa-solid fa-key"></i> Update Password
                    </button>
                </div>
            </form>
        </section>
    </main>

    <!-- Universal Header Script (Auto-injects header, navigation drawer, and global modals) -->
    <script src="../Shared/header.js"></script>
    <!-- Page Logic -->
    <script src="/SettingsPage/SettingsPage.js"></script>
</body>
</html>
