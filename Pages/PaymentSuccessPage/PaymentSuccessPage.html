<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - Rhythm & Soul</title>
    <link rel="stylesheet" href="../Shared/header.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="PaymentSuccessPage.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="success-main">
        <div class="success-container fade-in">
            <div class="success-icon-wrapper">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h1 id="successTitle">Enrollment Confirmed!</h1>
            <p class="success-subtitle" id="successSubtitle">Thank you for your payment. Your spot in the dance class has been successfully secured.</p>
            
            <div class="success-details-card">
                <div class="detail-row">
                    <span class="detail-label"><i class="fa-solid fa-receipt"></i> Status</span>
                    <span class="detail-value status-paid">Paid & Confirmed</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label"><i class="fa-solid fa-calendar-days"></i> Next Step</span>
                    <span class="detail-value" id="nextStepText">Check your schedule & get ready to dance!</span>
                </div>
            </div>

            <div class="success-actions">
                <a href="../ClassSchedulePage/ClassSchedulePage.html" id="primaryActionBtn" class="btn-primary">
                    <i class="fa-solid fa-calendar-alt"></i> View Class Schedule
                </a>
                <a href="../LandingPage/LandingPage.html" class="btn-secondary">
                    <i class="fa-solid fa-house"></i> Return Home
                </a>
            </div>
        </div>
    </main>

    <script src="../Shared/header.js"></script>
    <script src="PaymentSuccessPage.js"></script>
</body>
</html>
