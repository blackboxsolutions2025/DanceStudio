<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog - Rhythm & Soul</title>
    <link rel="stylesheet" href="ProductListPage.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="app-container">
        <main class="main-content">
            <header class="top-bar">
                <div class="page-title">
                    <h1>Product Catalog</h1>
                    <p>Manage base items, categories, brands, and track dynamic variant inventory.</p>
                </div>
                <div class="header-actions">
                    <!-- Navigates directly to ReferenceDataPage -->
                    <a href="../ReferenceDataPage/ReferenceDataPage.html" class="icon-btn" title="Catalog Reference Data">
                        <i class="fa-solid fa-gear"></i>
                    </a>
                </div>
            </header>

            <div class="content-body">
                <!-- Action Toolbar -->
                <div class="toolbar">
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="searchInput" placeholder="Search products, brands, or categories...">
                    </div>
                    <button class="btn-primary" id="addProductBtn">
                        <i class="fa-solid fa-plus"></i> Add New Product
                    </button>
                </div>

                <!-- Products Table Card -->
                <div class="table-card">
                    <div class="table-responsive">
                        <table id="productTable">
                            <thead>
                                <tr>
                                    <th>Product Name</th>
                                    <th>Brand</th>
                                    <th>Category</th>
                                    <th>Total Stock</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="productTableBody">
                                <tr>
                                    <td colspan="5" class="loading-text">Loading inventory...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Variants Modal Backdrop & Container -->
    <div class="modal-backdrop" id="variantsModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalProductName">Product Variants</h3>
                <button class="close-modal-btn" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>SKU</th>
                                <th>Attributes / Specs</th>
                                <th>Retail Price</th>
                                <th>Stock Level</th>
                            </tr>
                        </thead>
                        <tbody id="variantsTableBody">
                            <tr><td colspan="4" class="loading-text">Loading variants...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Global Header Script -->
    <script src="../Shared/header.js"></script>
    <!-- Page Specific Script -->
    <script src="ProductListPage.js"></script>
</body>
</html>
