<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm & Soul | Reset Password</title>
    <!-- Shared Header Styles -->
    <link rel="stylesheet" href="../Shared/header.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Page Specific Styles -->
    <link rel="stylesheet" href="ResetPasswordPage.css">
</head>
<body>

    <!-- Shared Header Placeholder -->
    <div id="header-placeholder"></div>

    <main class="auth-main">
        <div class="auth-container">
            <div class="auth-card">
                <form id="resetForm" class="auth-form">
                    <h2>Reset Password</h2>
                    <p class="subtitle">Please enter your new password below.</p>

                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> New Password</label>
                        <input type="password" id="newPassword" required placeholder="At least 6 characters">
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Confirm New Password</label>
                        <input type="password" id="confirmPassword" required placeholder="Re-enter new password">
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Save Password</button>

                    <p class="toggle-prompt"><a href="../LoginPage/LoginPage.html">Back to Log In</a></p>
                </form>
            </div>
        </div>
    </main>

    <!-- Global Modal Scripts -->
    <script src="../Shared/success-modal.js"></script>
    <script src="../Shared/error-modal.js"></script>
    <!-- Shared Header Script -->
    <script src="../Shared/header.js"></script>
    <!-- Page Specific Script -->
    <script src="ResetPasswordPage.js"></script>
</body>
</html>
